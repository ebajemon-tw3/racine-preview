<style>
  /* Page de connexion de la preversion (voir build.mjs). Valeurs reprises des
     jetons de app/globals.css : la page vit hors du build Next. */
  @font-face {
    font-family: "Heros";
    src: url("/racine-preview/fonts/text.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --canvas: #000000;
    --line: #2b2c31;
    --fg: #ffffff;
    --fg-muted: #9d9ea6;
    --danger: #e08585;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--canvas);
    color: var(--fg);
    font: 400 1rem/1.5 "Heros", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 22rem; }
  .logo { display: block; height: 1.25rem; width: auto; }
  .label {
    margin: 3rem 0 0;
    color: var(--fg-muted);
    font-size: 0.75rem;
    line-height: 1.05;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  h1 {
    margin: 1rem 0 0;
    font-size: 2.25rem;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.035em;
  }
  p { margin: 1rem 0 0; color: var(--fg-muted); font-size: 0.9375rem; }
  form { margin-top: 2.5rem; }
  label {
    display: block;
    color: var(--fg-muted);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  input, button {
    display: block;
    width: 100%;
    height: 2.75rem;
    border-radius: 0;
    font: inherit;
  }
  input {
    margin-top: 0.5rem;
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--fg-muted);
    background: transparent;
    color: inherit;
  }
  input:focus { border-bottom-color: var(--fg); }
  input[aria-invalid="true"] { border-bottom-color: var(--danger); }
  button {
    margin-top: 1.5rem;
    border: 1px solid var(--fg);
    background: var(--fg);
    color: var(--canvas);
    font-size: 0.9375rem;
    cursor: pointer;
    transition: opacity 300ms ease-out;
  }
  button:hover { opacity: 0.8; }
  button:disabled { opacity: 0.6; cursor: progress; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .message { min-height: 1.5rem; margin-top: 1rem; font-size: 0.875rem; }
  .message[data-error] { color: var(--danger); }
</style>

  <p class="label">Version de travail</p>
  <h1>Accès restreint</h1>
  <p>Saisissez le mot de passe qui vous a été communiqué.</p>
  <noscript><p>L'ouverture du site nécessite JavaScript.</p></noscript>
  <form id="form" novalidate>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" autofocus aria-describedby="message">
    <button type="submit">Accéder au site</button>
    <p id="message" class="message" role="status"></p>
  </form>
</main>
<script>
  const BASE = "/racine-preview";
  const ITERATIONS = 600000;
  const CACHE = "racine-preview";

  const form = document.getElementById("form");
  const input = document.getElementById("password");
  const button = form.querySelector("button");
  const message = document.getElementById("message");

  function say(text, { error = false, invalid = false } = {}) {
    message.textContent = text;
    message.toggleAttribute("data-error", error);
    input.setAttribute("aria-invalid", String(invalid));
  }

  function busy(on) {
    button.disabled = on;
    button.textContent = on ? "Ouverture…" : "Accéder au site";
  }

  // Le service worker doit etre actif avant qu'on ecrive dans le cache : un
  // worker plus recent (nouvelle publication) vide le cache en s'activant.
  async function ready() {
    const registration = await navigator.serviceWorker.register(`${BASE}/sw.js`, { scope: `${BASE}/` });
    await registration.update().catch(() => {});
    const worker = registration.installing || registration.waiting;
    if (worker) {
      await new Promise((resolve, reject) => {
        const check = () => {
          if (worker.state === "activated") resolve();
          else if (worker.state === "redundant") reject(new Error("Service worker abandonne."));
        };
        worker.addEventListener("statechange", check);
        check();
      });
    }
    await navigator.serviceWorker.ready;
  }

  // Le paquet est publie en morceaux (limite de 100 Mo par fichier sur
  // GitHub), rassembles ici dans l'ordre.
  const PARTS = 2;

  async function download() {
    const chunks = await Promise.all(
      Array.from({ length: PARTS }, async (_, i) => {
        const response = await fetch(`${BASE}/site.bin.${i}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`site.bin.${i} : ${response.status}`);
        return new Uint8Array(await response.arrayBuffer());
      }),
    );
    const sealed = new Uint8Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
    let offset = 0;
    for (const chunk of chunks) {
      sealed.set(chunk, offset);
      offset += chunk.length;
    }
    return sealed;
  }

  // Format de site.bin : [sel 16][IV 12][chiffre + etiquette GCM]. Renvoie null
  // si le mot de passe ne dechiffre pas.
  async function decrypt(sealed, password) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: sealed.subarray(0, 16), iterations: ITERATIONS, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"],
    );
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: sealed.subarray(16, 28) }, key, sealed.subarray(28));
      return new Uint8Array(plain);
    } catch {
      return null;
    }
  }

  // Paquet dechiffre : [longueur de l'index sur 4 octets][index JSON][contenus].
  async function store(plain) {
    const length = new DataView(plain.buffer, plain.byteOffset).getUint32(0);
    const index = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + length)));
    const cache = await caches.open(CACHE);
    let offset = 4 + length;
    const writes = [];
    for (const [path, type, size] of index) {
      const body = plain.subarray(offset, offset + size);
      offset += size;
      writes.push(cache.put(BASE + path, new Response(body, { headers: { "content-type": type } })));
    }
    await Promise.all(writes);
  }

  if (!("serviceWorker" in navigator) || !("caches" in window) || !window.crypto?.subtle) {
    say("Ce navigateur ne permet pas d'ouvrir cette version du site. Ouvrez la page dans une fenêtre normale, hors navigation privée, d'un navigateur récent.", { error: true });
    input.disabled = true;
    button.disabled = true;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = input.value.trim();
    if (!password) {
      say("Saisissez le mot de passe.", { error: true, invalid: true });
      input.focus();
      return;
    }
    busy(true);
    say("");
    try {
      const [sealed] = await Promise.all([download(), ready()]);
      const plain = await decrypt(sealed, password);
      if (!plain) {
        busy(false);
        say("Mot de passe incorrect.", { error: true, invalid: true });
        input.select();
        return;
      }
      await store(plain);
      location.reload();
    } catch (error) {
      console.error(error);
      busy(false);
      say("Le site n'a pas pu être chargé. Vérifiez la connexion et réessayez.", { error: true });
    }
  });
</script>
